<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casino Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Oswald:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="diseño/style.css">
</head>
<body>
<main>
  <h1>Casino Night</h1>
  <button class="sound" id="soundBtn" aria-pressed="true">Sound: ON</button>

  <!-- PHASE 1: pick the 3 players -->
  <section id="phase1">
    <h2>Spin three times to pick the players</h2>
    <div class="wheelbox">
      <div class="pointer"></div>
      <canvas id="numWheel" width="380" height="380"></canvas>
      <div class="hub">GO</div>
    </div>
    <div class="panel"><div class="players" id="picks"></div></div>
    <div class="note" id="banNote"></div>
    <div class="msg" id="msg1" aria-live="polite">Spin 1 of 3</div>
    <button class="gold" id="spin">SPIN</button>
  </section>

  <!-- PHASE 2: the color roulette -->
  <section id="phase2" class="hidden">
    <h2 id="turnTitle"></h2>
    <div class="wheelbox">
      <canvas id="rrWheel" width="380" height="380"></canvas>
    </div>
    <div class="panel"><div class="players" id="status"></div></div>
    <div class="msg" id="msg2" aria-live="polite"></div>

    <div class="chips" id="betRow">
      <button class="chip bet" data-c="red">RED</button>
      <button class="chip bet" data-c="black">BLACK</button>
      <button class="chip bet" data-c="green">GREEN</button>
    </div>
    <button class="gold hidden" id="go">SPIN</button>
    <div class="chips hidden" id="colorRow">
      <button class="chip pick" data-c="red">RED</button>
      <button class="chip pick" data-c="black">BLACK</button>
      <button class="chip pick" data-c="green">GREEN</button>
    </div>
    <button class="gold hidden" id="nextTurn">NEXT TURN</button>
    <div class="hidden" id="endBox">
      <div id="summary"></div>
      <button class="gold" id="newGame">NEW GAME</button>
    </div>
  </section>
</main>

<script src="javascripts/script.js"></script>
</body>
</html>
